name: Build LaTeX document

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Compile PDF
        uses: dante-ev/latex-action@2026-A
        with:
          root_file: main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aswin_Resume
          path: main.pdf

      - name: Rename PDF for release
        run: cp main.pdf Aswin_Resume.pdf

      - name: Publish latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Aswin_Resume.pdf \
            --title "Latest Resume" \
            --notes "Automatically published from the latest commit on master (${{ github.sha }})." \
            --target ${{ github.sha }}
